name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build, lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The devDependency (@cucumber/cucumber ^13.2.1) requires Node
          # 22/24/26 (confirmed via `npm view @cucumber/cucumber@13 engines`)
          # — unlike qualflare-cypress's fixed Node 20, this floor climbs
          # with each cucumber-js major (see the integration matrix below).
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Integration (real cucumber-js run) — cucumber ${{ matrix.cucumber }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Validates the peerDependencies.cucumber range (">=10.8.0 <14")
        # empirically. Each leg's Node version matches what that cucumber-js
        # major actually requires (confirmed via `npm view @cucumber/cucumber
        # @<version> engines` for each): 10.8 -> Node 18||>=20, 11 -> Node
        # 18||20||>=22, 12/13 -> Node 20||22||>=24 and 22||24||>=26
        # respectively — Node 22 satisfies all four ranges, so it's used
        # uniformly here rather than varying per leg.
        include:
          - cucumber: '^10.8.0'
            node: '20'
          - cucumber: '^11.0.0'
            node: '22'
          - cucumber: '^12.0.0'
            node: '22'
          - cucumber: '^13.0.0'
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install matrix cucumber-js version
        run: npm install --no-save "@cucumber/cucumber@${{ matrix.cucumber }}"
      - run: npm run build
      - run: npm run test:integration
