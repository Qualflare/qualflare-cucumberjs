name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build, lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The devDependency (@cucumber/cucumber ^13.2.1) requires Node
          # 22/24/26 (confirmed via `npm view @cucumber/cucumber@13 engines`)
          # — unlike qualflare-cypress's fixed Node 20, this floor climbs
          # with each cucumber-js major (see the integration matrix below).
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Integration (real cucumber-js run) — cucumber ${{ matrix.cucumber }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Validates the peerDependencies.cucumber range (">=10.8.0")
        # empirically. The range is open-ended, so this matrix can only ever
        # prove the majors that existed when it was last touched — add a leg
        # when cucumber-js ships a new major; the range itself needs no edit. Each leg's Node version matches what that cucumber-js
        # major actually requires (confirmed via `npm view @cucumber/cucumber
        # @<version> engines` for each): 10.8 -> Node 18||>=20, 11 -> Node
        # 18||20||>=22, 12/13 -> Node 20||22||>=24 and 22||24||>=26
        # respectively — Node 22 satisfies all four ranges, so it's used
        # uniformly here rather than varying per leg.
        include:
          - cucumber: '^10.8.0'
            node: '20'
          - cucumber: '^11.0.0'
            node: '22'
          - cucumber: '^12.0.0'
            node: '22'
          - cucumber: '^13.0.0'
            node: '22'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install with matrix cucumber-js version
        # Deliberately a full, fresh resolution rather than `npm ci` followed
        # by `npm install --no-save @cucumber/cucumber@X`. That incremental
        # form trips npm's optional-dependency pruning bug (npm/cli#4828):
        # re-resolving one package silently drops platform-specific binaries
        # (@rollup/rollup-linux-x64-gnu, esbuild's) and the build then dies
        # with a MODULE_NOT_FOUND pointing nowhere near the real cause.
        run: |
          npm pkg set devDependencies.@cucumber/cucumber="${{ matrix.cucumber }}"
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:integration

  example:
    name: Example project (packaged tarball smoke test)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      # Node 24, for its npm 11. Dependabot regenerates package-lock.json with
      # npm 11, which dedupes the wildcard `@types/node: *` that the framework
      # packages depend on; npm 10 (Node 20 and 22) then rejects that lockfile as
      # out of sync and every Dependabot PR fails in `npm ci` before it reaches
      # the change it is testing. Node 20 is also EOL as of 2026-04-30.
      #
      # This is the build runtime only. `engines` still allows >=18, and the
      # framework matrix below picks its own Node per leg -- do not fold this
      # value into those.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Install the LOCAL build into the example as a real packed tarball
      # rather than linking src/. That exercises package.json's `files` and
      # `exports` maps exactly as a consumer would — the one failure class no
      # local typecheck/lint/test can see, because it only exists in the
      # published artifact. Overrides the example's own `^0.2.0` npm
      # dependency, so this tests the code in the commit, not what's on npm.
      #
      # Note this rewrites examples/basic/package.json's dependency to a
      # `file:` path. That is fine here — the checkout is ephemeral — but it
      # means running these steps locally will dirty that file; `git checkout
      # examples/` afterwards.
      - name: Pack and install into examples/basic
        run: |
          TARBALL="$(npm pack --silent | tail -1)"
          cd examples/basic
          npm install --no-audit --no-fund "../../$TARBALL"

      # Run it exactly as examples/basic/README.md tells a user to. This is
      # the check that would have caught the example drifting to document a
      # removed QUALFLARE_TOKEN upload flow: nothing else in CI ever executes
      # the example project.
      - name: Run the example as its README documents
        working-directory: examples/basic
        run: npm test

      - name: Assert it produced a usable report
        working-directory: examples/basic
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = "qualflare-results";
            if (!fs.existsSync(dir)) throw new Error(`${dir} was never created`);
            const reports = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (reports.length !== 1) throw new Error(`expected 1 report, found ${reports.length}`);
            const payload = JSON.parse(fs.readFileSync(`${dir}/${reports[0]}`, "utf8"));
            const cases = payload.suites.flatMap((s) => s.cases);
            if (cases.length === 0) throw new Error("report contains no cases");
            console.log(`OK: ${payload.suites.length} suite(s), ${cases.length} case(s)`);
          '
